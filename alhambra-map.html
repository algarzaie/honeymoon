const mins=t=>{const[a,b]=t.split(":");return +a*60+ +b};
function nowM(){const p=new Intl.DateTimeFormat("en-GB",{timeZone:"Europe/Madrid",hour:"2-digit",minute:"2-digit",hour12:false}).format(new Date());document.getElementById("clock").textContent=UI[L].clock+p;return mins(p)}
